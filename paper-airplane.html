<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#f6f7f2" />
  <title>Paper Airplane</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1d232a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }

    #game-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Phaser injects its canvas here; keep it crisp and centered. */
    #game-container canvas {
      display: block;
      touch-action: none;
    }
  
    .back-link {
      position: fixed;
      top: max(8px, env(safe-area-inset-top));
      right: 8px;
      z-index: 10;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      font-size: 13px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <a class="back-link" href="./">&larr; Games</a>
  <div id="game-container"></div>

  <!-- Phaser 3, vendored locally so the game is fully self-contained and works offline. -->
  <script src="vendor/phaser.min.js"></script>
  <script src="src/paper-airplane.js"></script>
</body>
</html>

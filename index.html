<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#140f33" />
  <title>Fantasia</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1d232a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }

    #game-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Phaser injects its canvas here; keep it crisp and centered. */
    #game-container canvas {
      display: block;
      touch-action: none;
    }

    /* ----------------------------------------------------------------- */
    /*  Fantasia game-selector menu (the first screen on load).          */
    /* ----------------------------------------------------------------- */

    #menu-screen {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(24px, 6vh, 48px);
      padding: 6vh 5vw;
      text-align: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 18%, rgba(126, 116, 224, 0.38), transparent 60%),
        radial-gradient(ellipse at 50% 120%, rgba(15, 8, 32, 0.95), transparent 70%),
        linear-gradient(180deg, #1b1440 0%, #0d0a24 55%, #05030f 100%);
    }

    /* A sparse dusting of stars for the "Fantasia" night-sky feel. */
    #menu-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.6;
      background-image:
        radial-gradient(1.6px 1.6px at 25% 15%, #fff, transparent),
        radial-gradient(1px 1px at 70% 22%, #fff, transparent),
        radial-gradient(1.6px 1.6px at 40% 58%, #fff, transparent),
        radial-gradient(1px 1px at 85% 68%, #fff, transparent),
        radial-gradient(1px 1px at 14% 78%, #fff, transparent),
        radial-gradient(1.6px 1.6px at 60% 86%, #fff, transparent),
        radial-gradient(1px 1px at 90% 42%, #fff, transparent),
        radial-gradient(1px 1px at 50% 34%, #fff, transparent),
        radial-gradient(1.4px 1.4px at 8% 40%, #fff, transparent),
        radial-gradient(1px 1px at 33% 88%, #fff, transparent);
    }

    .menu-inner {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(20px, 5vh, 40px);
    }

    /* The title: a rich, rounded 1970s-Disney-style serif in warm gold. */
    .menu-title {
      font-family: "Cooper Black", "Bookman Old Style", "Palatino Linotype",
        Palatino, Georgia, "Times New Roman", serif;
      font-weight: 700;
      font-size: clamp(58px, 19vw, 132px);
      line-height: 0.95;
      letter-spacing: 0.015em;
      background: linear-gradient(180deg, #fff6d5 0%, #f6d879 34%, #e2a72f 68%, #a5610f 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      filter:
        drop-shadow(0 2px 0 rgba(74, 38, 0, 0.55))
        drop-shadow(0 10px 22px rgba(0, 0, 0, 0.6));
    }

    .menu-tagline {
      margin-top: clamp(6px, 1.4vh, 14px);
      font-family: "Palatino Linotype", Palatino, Georgia, serif;
      font-style: italic;
      font-size: clamp(15px, 4.5vw, 22px);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #d8cdff;
      opacity: 0.85;
    }

    /* Two-page carousel of game buttons. Pages slide horizontally; the
       off-screen page is clipped by #menu-screen's overflow:hidden. */
    .menu-pages {
      position: relative;
      width: min(360px, 84vw);
    }

    .menu-page {
      display: flex;
      flex-direction: column;
      gap: clamp(14px, 2.6vh, 20px);
      transition: transform 0.42s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Page 1 stays in flow (gives the carousel its height); page 2 overlays it. */
    #page-1 {
      position: relative;
      transform: translateX(0);
    }

    #page-2 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      transform: translateX(120%);
    }

    #menu-screen[data-page="2"] #page-1 {
      transform: translateX(-120%);
    }

    #menu-screen[data-page="2"] #page-2 {
      transform: translateX(0);
    }

    .menu-btn {
      font-family: "Cooper Black", "Bookman Old Style", Georgia, serif;
      font-size: clamp(20px, 5.6vw, 27px);
      padding: 16px 22px;
      border-radius: 15px;
      cursor: pointer;
      transition: transform 0.06s ease, box-shadow 0.06s ease;
    }

    .menu-btn--primary {
      color: #3a2500;
      border: 2px solid #ffe9ad;
      background: linear-gradient(180deg, #ffe7a3 0%, #f0b94a 100%);
      box-shadow: 0 6px 0 #8a5a12, 0 12px 22px rgba(0, 0, 0, 0.45);
    }

    .menu-btn--primary:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #8a5a12, 0 6px 14px rgba(0, 0, 0, 0.4);
    }

    .menu-btn--secondary {
      color: #ffe7a3;
      border: 2px solid rgba(255, 224, 138, 0.7);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35), 0 12px 22px rgba(0, 0, 0, 0.35);
    }

    .menu-btn--secondary:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35), 0 6px 14px rgba(0, 0, 0, 0.3);
    }

    /* Blank placeholder buttons on page 2 (no text, no action). */
    .menu-btn--blank {
      cursor: default;
    }

    /* Bottom-corner page-navigation arrows. */
    .menu-arrow {
      position: absolute;
      bottom: clamp(16px, 4vh, 34px);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid rgba(255, 224, 138, 0.8);
      background: rgba(255, 255, 255, 0.06);
      color: #ffe7a3;
      font-size: 30px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 25;
      transition: opacity 0.3s ease, transform 0.06s ease;
    }

    .menu-arrow--right { right: clamp(16px, 5vw, 30px); }
    .menu-arrow--left { left: clamp(16px, 5vw, 30px); }
    .menu-arrow:active { transform: scale(0.9); }

    /* Show the right arrow on page 1, the left arrow on page 2. */
    #menu-screen[data-page="2"] .menu-arrow--right,
    #menu-screen:not([data-page="2"]) .menu-arrow--left {
      opacity: 0;
      pointer-events: none;
    }

    /* "Under construction" modal (Underfoot). */
    #uc-modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 6vw;
      background: rgba(4, 2, 14, 0.7);
    }

    #uc-modal.is-open { display: flex; }

    .uc-card {
      max-width: 88vw;
      padding: clamp(26px, 6vw, 42px) clamp(28px, 7vw, 48px);
      text-align: center;
      border: 3px solid #ffd23f;
      border-radius: 18px;
      background: linear-gradient(180deg, #2c3170 0%, #14173a 100%);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
    }

    .uc-text {
      font-family: "Cooper Black", "Bookman Old Style", Georgia, serif;
      font-size: clamp(28px, 8vw, 46px);
      font-weight: 700;
      color: #ffe7a3;
      text-shadow: 0 2px 0 rgba(74, 38, 0, 0.5);
    }

    .uc-sub {
      margin-top: 10px;
      font-family: "Palatino Linotype", Palatino, Georgia, serif;
      font-style: italic;
      color: #cfe0ff;
      font-size: clamp(14px, 4vw, 17px);
    }

    .uc-close {
      margin-top: clamp(18px, 3.5vh, 26px);
      font-family: "Cooper Black", "Bookman Old Style", Georgia, serif;
      font-size: clamp(16px, 4.5vw, 20px);
      color: #3a2500;
      border: 2px solid #ffe9ad;
      border-radius: 12px;
      padding: 10px 24px;
      cursor: pointer;
      background: linear-gradient(180deg, #ffe7a3 0%, #f0b94a 100%);
      box-shadow: 0 5px 0 #8a5a12;
      transition: transform 0.06s ease, box-shadow 0.06s ease;
    }

    .uc-close:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #8a5a12;
    }
  </style>
</head>
<body>
  <!-- Phaser mounts the selected game's canvas here once it's launched. -->
  <div id="game-container"></div>

  <!-- Default screen: the Fantasia game selector. -->
  <div id="menu-screen">
    <div class="menu-inner">
      <div>
        <h1 class="menu-title">Fantasia</h1>
        <p class="menu-tagline">Select your adventure</p>
      </div>
      <div class="menu-pages">
        <div class="menu-page" id="page-1">
          <button id="btn-flappy" class="menu-btn menu-btn--primary" type="button">
            Flappy Bird
          </button>
          <button id="btn-avians" class="menu-btn menu-btn--secondary" type="button">
            Annoyed Avians
          </button>
          <button id="btn-starcatcher" class="menu-btn menu-btn--secondary" type="button">
            Star Catcher
          </button>
          <button id="btn-arrow" class="menu-btn menu-btn--secondary" type="button">
            Arrow Rush
          </button>
          <button id="btn-cosmicdash" class="menu-btn menu-btn--secondary" type="button">
            Cosmic Dash
          </button>
        </div>
        <div class="menu-page" id="page-2" aria-hidden="true">
          <button id="btn-underfoot" class="menu-btn menu-btn--secondary" type="button">
            Underfoot
          </button>
          <button id="btn-gloom" class="menu-btn menu-btn--secondary" type="button">
            Gloom Hollow
          </button>
          <button id="btn-combat" class="menu-btn menu-btn--secondary" type="button">
            Combat Sim
          </button>
          <button class="menu-btn menu-btn--secondary menu-btn--blank" type="button" aria-hidden="true"></button>
          <button class="menu-btn menu-btn--secondary menu-btn--blank" type="button" aria-hidden="true"></button>
        </div>
      </div>
    </div>

    <!-- Bottom-corner page navigation. -->
    <button class="menu-arrow menu-arrow--left" id="page-prev" type="button" aria-label="Previous page">←</button>
    <button class="menu-arrow menu-arrow--right" id="page-next" type="button" aria-label="Next page">→</button>
  </div>

  <!-- "Under construction" modal (Underfoot, page 2). -->
  <div id="uc-modal" role="dialog" aria-modal="true" aria-label="Under construction">
    <div class="uc-card">
      <div class="uc-text">under construction</div>
      <div class="uc-sub">Underfoot isn't ready to explore yet.</div>
      <button id="uc-close" class="uc-close" type="button">OK</button>
    </div>
  </div>

  <!-- Phaser 4, vendored locally so the games are fully self-contained and work offline. -->
  <script src="vendor/phaser.min.js"></script>
  <script src="src/game.js"></script>
  <script src="src/annoyed-avians.js"></script>
  <script src="src/star-catcher.js"></script>
  <script src="src/arrow-rush.js"></script>
  <script src="src/cosmic-dash.js"></script>
  <script src="src/combat-sim.js"></script>
  <script src="src/gloom-hollow.js"></script>
  <script>
    // Wire up the Fantasia selector. Each game's Phaser instance is created on
    // demand when its button is pressed, so the menu is always shown first.
    (function () {
      var menu = document.getElementById("menu-screen");

      function hideMenu() {
        menu.style.display = "none";
      }

      document.getElementById("btn-flappy").addEventListener("click", function () {
        hideMenu();
        if (typeof window.launchFlappyBird === "function") window.launchFlappyBird();
      });

      document.getElementById("btn-avians").addEventListener("click", function () {
        hideMenu();
        if (typeof window.launchAnnoyedAvians === "function") window.launchAnnoyedAvians();
      });

      document.getElementById("btn-starcatcher").addEventListener("click", function () {
        hideMenu();
        if (typeof window.launchStarCatcher === "function") window.launchStarCatcher();
      });

      document.getElementById("btn-arrow").addEventListener("click", function () {
        hideMenu();
        if (typeof window.launchArrowRush === "function") window.launchArrowRush();
      });

      document.getElementById("btn-cosmicdash").addEventListener("click", function () {
        hideMenu();
        if (typeof window.launchCosmicDash === "function") window.launchCosmicDash();
      });

      // Page carousel: slide between the two pages of game buttons.
      document.getElementById("page-next").addEventListener("click", function () {
        menu.dataset.page = "2";
      });
      document.getElementById("page-prev").addEventListener("click", function () {
        menu.dataset.page = "1";
      });

      document.getElementById("btn-combat").addEventListener("click", function () {
        hideMenu();
        if (typeof window.launchCombatSim === "function") window.launchCombatSim();
      });

      document.getElementById("btn-gloom").addEventListener("click", function () {
        hideMenu();
        if (typeof window.launchGloomHollow === "function") window.launchGloomHollow();
      });

      // Underfoot (page 2) -> "under construction" modal.
      var ucModal = document.getElementById("uc-modal");
      document.getElementById("btn-underfoot").addEventListener("click", function () {
        ucModal.classList.add("is-open");
      });
      function closeUc() {
        ucModal.classList.remove("is-open");
      }
      document.getElementById("uc-close").addEventListener("click", closeUc);
      ucModal.addEventListener("click", function (e) {
        if (e.target === ucModal) closeUc();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeUc();
      });

      // Return to the Fantasia menu from within a game: show the menu and tear
      // down whichever Phaser game is running (next tick, to avoid destroying
      // mid-callback).
      window.returnToMenu = function () {
        menu.style.display = "flex";
        setTimeout(function () {
          if (window.game) { try { window.game.destroy(true); } catch (e) {} window.game = null; }
          if (window.aviansGame) { try { window.aviansGame.destroy(true); } catch (e) {} window.aviansGame = null; }
          if (window.starCatcherGame) { try { window.starCatcherGame.destroy(true); } catch (e) {} window.starCatcherGame = null; }
          if (window.arrowGame) { try { window.arrowGame.destroy(true); } catch (e) {} window.arrowGame = null; }
          if (window.cosmicDashGame) { try { window.cosmicDashGame.destroy(true); } catch (e) {} window.cosmicDashGame = null; }
          if (window.combatGame) { try { window.combatGame.destroy(true); } catch (e) {} window.combatGame = null; }
          if (window.gloomGame) { try { window.gloomGame.destroy(true); } catch (e) {} window.gloomGame = null; }
        }, 0);
      };
    })();
  </script>
</body>
</html>

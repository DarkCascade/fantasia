<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1d232a" />
  <title>Fantasia — Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100vh;
      background: #1d232a;
      color: #f4f6f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 32px 16px;
    }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 28px; margin-bottom: 6px; }
    p.sub { color: #9aa7b3; margin-bottom: 24px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    a.card {
      display: block;
      padding: 20px;
      border-radius: 14px;
      text-decoration: none;
      color: #1d232a;
      transition: transform 0.12s ease;
    }
    a.card:hover, a.card:focus-visible { transform: translateY(-3px); }
    a.card h2 { font-size: 20px; margin-bottom: 6px; }
    a.card span { font-size: 14px; opacity: 0.8; }
    .flappy { background: #4ec0ca; }
    .airplane { background: #f6f7f2; }
  </style>
</head>
<body>
  <main>
    <h1>Fantasia</h1>
    <p class="sub">Pick a game.</p>
    <div class="grid">
      <a class="card flappy" href="flappy.html">
        <h2>🐤 Flappy Bird</h2>
        <span>Tap to flap through the pipes.</span>
      </a>
      <a class="card airplane" href="paper-airplane.html">
        <h2>✈️ Paper Airplane</h2>
        <span>Drag, release, and fly it into the bin.</span>
      </a>
    </div>
  </main>
</body>
</html>

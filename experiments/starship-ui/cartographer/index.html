<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starship UI · Cartographer</title>
<style>
  :root{--paper:#efe2c3;--ink:#2a2017;--brass:#a8792b;--verm:#b8452c;--verd:#3d7a6e}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#241c14;color:var(--ink);font-family:Georgia,"Palatino Linotype",Palatino,serif}
  body{display:flex;flex-direction:column;align-items:center}
  .bar{width:100%;display:flex;gap:14px;align-items:center;padding:8px 16px;font-size:13px;font-variant:small-caps;letter-spacing:.12em;
    color:#d8c49a;background:#1a140e;border-bottom:1px solid #3b2d1d}
  .bar a{color:#d8c49a;text-decoration:none}.bar b{color:#f0d79a;letter-spacing:.25em}
  .bar nav{margin-left:auto;display:flex;gap:6px}
  .bar button{all:unset;cursor:pointer;padding:4px 12px;border:1px solid #5a4630;border-radius:3px;color:#d8c49a}
  .bar button.on{background:#5a4630;color:#fff2d0}
  #stage{width:min(100vw,calc((100vh - 42px)*16/9));aspect-ratio:16/9}
  svg{width:100%;height:100%;display:block}
  text{fill:var(--ink)}
  .sc{font-variant:small-caps;letter-spacing:.14em}
  .it{font-style:italic}
  .num{opacity:0;transition:opacity .25s;font-size:11px;font-style:italic;fill:var(--verm);pointer-events:none}
  body.lens .num{opacity:1}
  [data-crew],[data-poi]{cursor:pointer}
  .steam{animation:steam 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes steam{0%{transform:translate(0,6px) scale(.5);opacity:0}25%{opacity:.7}100%{transform:translate(-6px,-34px) scale(1.5);opacity:0}}
  .bob{animation:bob 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
  @keyframes bob{to{transform:translateY(-3px) rotate(1.5deg)}}
  .sway{animation:sway 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
  @keyframes sway{to{transform:rotate(3deg)}}
  .flame{animation:flame .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes flame{to{transform:scale(.9,1.08)}}
  .gust{animation:gust 2s linear infinite}
  @keyframes gust{from{stroke-dashoffset:0}to{stroke-dashoffset:-40}}
  .tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .12s;z-index:9;max-width:240px;padding:7px 10px;
    background:#f6ecd0;border:1px solid #7a5d34;box-shadow:2px 3px 0 rgba(0,0,0,.25);font-size:13px;line-height:1.35;color:var(--ink);font-style:italic}
  .tip b{font-style:normal;font-variant:small-caps;letter-spacing:.08em}
</style>
</head>
<body>
<div class="bar">
  <a href="../index.html">◂ Gallery</a><b>Cartographer</b>
  <nav><button data-tab="ship">1 · Ship</button><button data-tab="market">2 · Trade hub</button>
  <button data-tab="explore">3 · Exploration</button><button data-lens>N · Numbers lens</button></nav>
</div>
<div id="stage"></div>

<script src="../shared/state.js"></script>
<script>
const S = STATE;
const K = { paper: "#efe2c3", paper2: "#f7efd9", ink: "#2a2017", brass: "#a8792b", verm: "#b8452c", verd: "#3d7a6e", indigo: "#4a6a8a",
  ochre: "#d9a441", sage: "#8aa36a", rose: "#c77a68", skin: "#f4e4c0" };
const WASH = { radiant: "#f0c75e", content: "#c9d27a", steady: "#b9c7a4", restless: "#a9b8c9", strained: "#d99a7c", fraying: "#c0675a" };
const GOODW = { ice: "#8fb8c8", grain: "#d9a441", salt: "#cfc4e0", cells: "#6fae8a", alloy: "#8d7fb8", glass: "#7fb4c9", med: "#c77a68", data: "#d98a41" };
const pct = (v) => Math.round(v * 100) + "%";
const crewById = S.crewById;

function defs() {
  return `<defs>
  <filter id="rough" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/></filter>
  <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="2" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="2"/><feColorMatrix values="0 0 0 0 .42  0 0 0 0 .32  0 0 0 0 .18  0 0 0 .2 0"/></filter>
  <filter id="blot" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="3" seed="6" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="14"/><feGaussianBlur stdDeviation=".8"/></filter>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="#8a6a3a" stop-opacity="0"/><stop offset="1" stop-color="#6a4a22" stop-opacity=".55"/></radialGradient>
  <pattern id="hatchI" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V5" stroke="#2a2017" stroke-width=".8" opacity=".5"/></pattern>
  <pattern id="waves" width="46" height="22" patternUnits="userSpaceOnUse"><path d="M4 12Q9 6 14 12T24 12" fill="none" stroke="#4a6a8a" stroke-width="1" opacity=".35"/></pattern>
  </defs>`;
}
function page(title, sub) {
  return `<rect width="1280" height="720" fill="${K.paper}"/><rect width="1280" height="720" filter="url(#grain)"/><rect width="1280" height="720" fill="url(#vig)"/>
  <g filter="url(#rough)" fill="none" stroke="${K.ink}"><rect x="14" y="14" width="1252" height="692" stroke-width="2.4"/><rect x="22" y="22" width="1236" height="676" stroke-width=".9"/>
    ${[[22, 22, 1, 1], [1258, 22, -1, 1], [22, 698, 1, -1], [1258, 698, -1, -1]].map(([x, y, a, b]) => `<path d="M${x} ${y + 26 * b}Q${x + 4 * a} ${y + 4 * b} ${x + 26 * a} ${y}M${x + 6 * a} ${y + 18 * b}Q${x + 8 * a} ${y + 8 * b} ${x + 18 * a} ${y + 6 * b}" stroke-width="1.2"/>`).join("")}</g>
  <text x="48" y="58" font-size="26" class="sc" style="font-weight:bold">${title}</text>
  <text x="50" y="80" font-size="14" class="it" fill="${K.ink}" opacity=".75">${sub}</text>
  <path d="M48 90H330" stroke="${K.ink}" stroke-width="1.2" filter="url(#rough)"/><circle cx="339" cy="90" r="2.5" fill="${K.verm}"/>`;
}
/* --- weather = mood ------------------------------------------------------ */
const CLOUD = "M-10 5Q-14 5-13 1Q-13-3-8-3Q-7-9 0-8Q6-8 7-3Q13-3 12 2Q12 5 8 5Z";
function weather(id, x, y, s = 1) {
  const ray = (n) => Array.from({ length: n }, (_, i) => { const a = (i / n) * 6.283; return `M${(Math.cos(a) * 8).toFixed(1)} ${(Math.sin(a) * 8).toFixed(1)}L${(Math.cos(a) * 11.5).toFixed(1)} ${(Math.sin(a) * 11.5).toFixed(1)}`; }).join("");
  const g = {
    radiant: `<circle r="6" fill="#f0c75e"/><path d="${ray(10)}"/>`,
    content: `<g transform="translate(-3 -3)"><circle r="5" fill="#f0c75e"/><path d="${ray(8)}" transform="scale(.8)"/></g><path d="${CLOUD}" transform="translate(3 3) scale(.7)" fill="${K.paper2}"/>`,
    steady: `<path d="${CLOUD}" fill="${K.paper2}"/>`,
    restless: `<path d="M-11-4H3Q8-4 8-8Q8-11 4-10M-11 1H7Q12 1 12 5Q12 8 8 7M-11 6H0"/>`,
    strained: `<path d="${CLOUD}" fill="#b9bcc2" transform="translate(0 -3)"/><path d="M-6 4L-8 9M0 4L-2 9M6 4L4 9" stroke="${K.indigo}"/>`,
    fraying: `<path d="${CLOUD}" fill="#7d7b82" transform="translate(0 -3)"/><path d="M1 2L-3 8H1L-2 13" stroke="${K.ochre}" stroke-width="2" fill="none"/>`,
  }[id];
  return `<g transform="translate(${x} ${y}) scale(${s})" fill="none" stroke="${K.ink}" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">${g}</g>`;
}
/* --- little drawn people --------------------------------------------------- */
const CLOTH = { reyes: K.indigo, juno: "#7a9a8a", tobe: K.verm, ama: "#f7efd9", ferro: K.ochre, pip: "#8d7fb8" };
function person(c, x, y, k = 1.35) {
  const m = S.moodOf(c.mood);
  const lean = { strained: 10, fraying: 15, restless: 0, steady: 0, content: -2, radiant: -4 }[m.id];
  const acc = {
    reyes: `<path d="M-5-30Q0-38 5-30Z" fill="${K.indigo}"/>`, juno: `<path d="M-5-29H5" stroke="${K.verm}" stroke-width="2"/>`,
    tobe: `<circle cx="-2" cy="-30" r="1.8"/><circle cx="2.4" cy="-30" r="1.8"/>`, ama: `<path d="M0-19V-12M-3.5-15.5H3.5" stroke="${K.verm}" stroke-width="1.6"/>`,
    ferro: `<ellipse cy="-33" rx="5" ry="3.4" fill="#fff"/>`, pip: `<circle cx="-2" cy="-27" r="1.9"/><circle cx="2.4" cy="-27" r="1.9"/>`,
  }[c.id];
  return `<g transform="translate(${x} ${y}) scale(${k})" data-crew="${c.id}" data-tip="<b>${c.name}</b> · ${c.role}<br>${m.word}${c.wants ? " — wants " + c.wants : ""}">
    <ellipse rx="9" ry="2" fill="${K.ink}" opacity=".18"/>
    <g transform="rotate(${lean})" fill="none" stroke="${K.ink}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough2)">
      <path d="M-3-1V-9M3-1V-9"/><path d="M-5-9L-4-21Q0-24 4-21L5-9Z" fill="${CLOTH[c.id]}"/><circle cy="-27" r="4.6" fill="${K.skin}"/>${acc}
      ${c.doing === "repairing" ? `<path d="M5-17L12-22" stroke-width="1.6"/>` : ""}
    </g>${weather(m.id, 0, -47, 0.72)}</g>`;
}
/* --- vessels for supplies -------------------------------------------------- */
function vessel(kind, x, y, v, label, tip) {
  let body = "", clip = "";
  if (kind === "flask") { clip = "M-6-18H6V-8L14 10Q16 18 8 18H-8Q-16 18-14 10L-6-8Z"; }
  if (kind === "sack") { clip = "M-12 16Q-16 0-6-6L-8-14H8L6-6Q16 0 12 16Z"; }
  const L = 34, top = 18 - v * L, col = kind === "flask" ? "#6fa8c9" : "#d9a441";
  if (kind === "flask" || kind === "sack") {
    body = `<clipPath id="c-${kind}"><path d="${clip}"/></clipPath>
      <g clip-path="url(#c-${kind})"><rect x="-20" y="${top}" width="40" height="40" fill="${col}" opacity=".75"/><path d="M-20 ${top}Q-10 ${top - 3} 0 ${top}T20 ${top}" fill="none" stroke="${K.ink}" stroke-width=".8"/></g>
      <path d="${clip}" fill="none" stroke="${K.ink}" stroke-width="1.5"/>${kind === "flask" ? `<path d="M-8-18H8M-6-22H6" stroke="${K.ink}" stroke-width="1.4"/><path d="M-9 4H-6M-10 -2H-7" stroke="${K.ink}" stroke-width=".8"/>` : `<path d="M-8-10H8" stroke="${K.ink}" stroke-width="1.5"/><path d="M-5-14L-8-20M5-14L8-20" stroke="${K.ink}"/>`}`;
  } else if (kind === "tray") {
    body = `<rect x="-17" y="-8" width="34" height="22" rx="3" fill="${K.paper2}" stroke="${K.ink}" stroke-width="1.5"/>` +
      Array.from({ length: 6 }, (_, i) => { const cx = -10 + (i % 3) * 10, cy = -1 + Math.floor(i / 3) * 10; return `<circle cx="${cx}" cy="${cy}" r="3.4" fill="${i < Math.round(v * 6) ? K.brass : "none"}" stroke="${K.ink}" stroke-width="1"/>`; }).join("");
  } else {
    body = `<path d="M-13 14Q-17-4-6-8L-8-14Q0-18 8-14L6-8Q17-4 13 14Q0 19-13 14Z" fill="${K.rose}" opacity=".85" stroke="${K.ink}" stroke-width="1.5"/><path d="M-7-12H7" stroke="${K.ink}"/><circle cx="0" cy="3" r="4" fill="${K.ochre}" stroke="${K.ink}"/>`;
  }
  return `<g transform="translate(${x} ${y})" data-tip="${tip}"><g filter="url(#rough2)">${body}</g>
    <text y="34" text-anchor="middle" font-size="11" class="sc">${label}</text>${v != null ? `<text class="num" y="46" text-anchor="middle">${pct(v)}</text>` : ""}</g>`;
}
function margin() {
  const sp = S.ship.supplies;
  return `${vessel("flask", 1000, 56, sp.fuel, "Fuel", "<b>Fuel</b><br>" + (sp.fuel < 0.5 ? "A flask less than half full." : "Plenty."))}
    ${vessel("sack", 1070, 56, sp.rations, "Rations", "<b>Rations</b><br>Ferro says they're fine.")}
    ${vessel("tray", 1140, 56, sp.parts, "Spares", "<b>Spare parts</b><br>The tray is mostly empty.")}
    ${vessel("purse", 1210, 56, null, "Purse", "<b>Credits</b><br>A respectable purse.")}`;
}
function slip(x, y, rot, w, h, text, tx, ty) {
  return `<g transform="translate(${x} ${y}) rotate(${rot})"><rect x="3" y="4" width="${w}" height="${h}" fill="#000" opacity=".12"/>
    <rect width="${w}" height="${h}" fill="#fbf4dc" stroke="${K.ink}" stroke-width=".9"/>
    <foreignObject x="8" y="6" width="${w - 14}" height="${h - 8}"><div xmlns="http://www.w3.org/1999/xhtml" style="font:italic 13px/1.25 Georgia,serif;color:#2a2017">${text}</div></foreignObject>
    <circle cx="${w / 2}" cy="4" r="4" fill="${K.verm}" stroke="${K.ink}" stroke-width=".8"/></g>`;
}

/* ======================================================================== SHIP */
let sel = "tobe";
const ROOMS = {
  engine: [20, 40, 180, 220, "Engine room"], lab: [200, 60, 170, 90, "Laboratory"], medbay: [370, 60, 170, 90, "Sick-bay"],
  quarters: [540, 60, 160, 90, "Quarters"], cargo: [200, 150, 240, 90, "Hold"], galley: [440, 150, 180, 90, "Galley"], bay: [620, 150, 80, 90, "Boat bay"],
};
const SPOT = { reyes: [840, 224], juno: [790, 238], tobe: [112, 252], ama: [455, 144], ferro: [525, 234], pip: [285, 144] };
const HULL = "M0 90L20 40H700L780 20L900 90L960 150L900 210L780 280L700 260H20L0 210Z";
const BRIDGE = "700,50 780,34 892,100 934,150 892,200 780,266 700,250";
const WEATHER_HIST = { tobe: ["steady", "steady", "steady", "restless", "restless", "restless", "strained", "strained", "strained", "strained"],
  juno: ["content", "content", "steady", "steady", "steady", "steady", "restless", "restless", "restless", "restless"],
  reyes: ["steady", "content", "steady", "content", "content", "content", "steady", "content", "content", "content"],
  ama: ["content", "content", "content", "content", "radiant", "content", "content", "content", "content", "content"],
  ferro: ["content", "radiant", "content", "radiant", "radiant", "radiant", "radiant", "radiant", "radiant", "radiant"],
  pip: ["steady", "steady", "content", "content", "content", "radiant", "radiant", "radiant", "radiant", "radiant"] };

function shipDrawing() {
  const pw = S.ship.systems.power;
  let s = `<clipPath id="hullc"><path d="${HULL}"/></clipPath>`;
  // washes by mood
  s += `<g filter="url(#blot)">`;
  for (const [id, [x, y, w, h]] of Object.entries(ROOMS)) {
    const cs = S.crew.filter((c) => c.room === id), m = cs.length ? cs.reduce((a, c) => a + c.mood, 0) / cs.length : 0.55;
    s += `<rect x="${x + 4}" y="${y + 4}" width="${w - 8}" height="${h - 8}" fill="${WASH[S.moodOf(m).id]}" opacity=".5"/>`;
  }
  const bm = (crewById.reyes.mood + crewById.juno.mood) / 2;
  s += `<polygon points="${BRIDGE}" fill="${WASH[S.moodOf(bm).id]}" opacity=".5"/></g>`;
  // hull: engraved double line + hatch shading
  s += `<g filter="url(#rough)"><path d="${HULL}" fill="none" stroke="${K.ink}" stroke-width="6"/><path d="${HULL}" fill="none" stroke="${K.paper}" stroke-width="3"/>
    <g clip-path="url(#hullc)"><rect x="0" y="228" width="960" height="60" fill="url(#hatchI)" opacity=".6"/><rect x="0" y="0" width="960" height="30" fill="url(#hatchI)" opacity=".25"/></g>
    <path d="M-34 110L0 100V200L-34 190Z" fill="${K.paper2}" stroke="${K.ink}" stroke-width="1.6"/><path d="M-34 128H-80M-34 150H-96M-34 172H-80" stroke="${K.ink}" stroke-width="1.2" stroke-dasharray="6 5"/></g>`;
  // rooms: walls + names
  s += `<g filter="url(#rough)" fill="none" stroke="${K.ink}" stroke-width="1.5">`;
  for (const [id, [x, y, w, h]] of Object.entries(ROOMS)) s += `<rect x="${x}" y="${y}" width="${w}" height="${h}"/>`;
  s += `<polygon points="${BRIDGE}"/><path d="M700 150H934" stroke-dasharray="5 6" stroke-width=".8" opacity=".6"/></g>`;
  for (const [id, [x, y, w, h, name]] of Object.entries(ROOMS)) s += `<text x="${x + 8}" y="${y + 15}" font-size="11" class="sc it" opacity=".8">${name}</text>`;
  s += `<text x="714" y="68" font-size="11" class="sc it" opacity=".8">Bridge</text>`;
  // props (ink)
  s += `<g filter="url(#rough)" fill="none" stroke="${K.ink}" stroke-width="1.3">
    <circle cx="110" cy="150" r="38"/><circle cx="110" cy="150" r="26" stroke-dasharray="3 4"/><circle cx="110" cy="150" r="8" fill="${K.ochre}"/>
    <path d="M72 150H20M148 150H200M110 112V50M110 188V250"/><path d="M60 240H76M146 240H162" stroke-width="3"/>
    <path d="M860 92Q928 150 860 208"/><rect x="768" y="224" width="22" height="14" rx="3"/><rect x="826" y="208" width="22" height="14" rx="3"/>
    <path d="M240 144H335M262 144V130H275V144"/><path d="M410 136H490V144M410 128V144"/><path d="M470 234H610M490 234V220H520V234"/><path d="M560 142V102H680V142M560 122H680"/><path d="M630 234H690L680 202H640Z"/></g>`;
  // lamps: brightness = power
  const lamp = (x, y, f = "") => `<g ${f}><circle cx="${x}" cy="${y + 8}" r="${(10 + pw * 14).toFixed(0)}" fill="#f7d77a" opacity="${(0.1 + pw * 0.28).toFixed(2)}" filter="url(#blot)"/><path d="M${x} ${y - 10}V${y}" stroke="${K.ink}" stroke-width="1"/><path d="M${x - 4} ${y}H${x + 4}L${x + 2.5} ${y + 6}H${x - 2.5}Z" fill="#f7d77a" stroke="${K.ink}" stroke-width="1"/></g>`;
  s += lamp(285, 74) + lamp(455, 74) + lamp(620, 74) + lamp(320, 164) + lamp(530, 164) + lamp(800, 62) + lamp(60, 62, 'class="sway"');
  // cargo crates
  const cells = []; S.market.goods.forEach((g) => { for (let i = 0; i < g.held; i++) cells.push(g.id); });
  for (let i = 0; i < S.ship.holdCap; i++) {
    const cx = 214 + (i % 10) * 22, cy = 178 + Math.floor(i / 10) * 26, id = cells[i];
    s += id ? `<g filter="url(#rough2)"><rect x="${cx}" y="${cy}" width="17" height="17" fill="${GOODW[id]}" stroke="${K.ink}" stroke-width="1.2"/><path d="M${cx} ${cy}L${cx + 17} ${cy + 17}M${cx + 17} ${cy}L${cx} ${cy + 17}" stroke="${K.ink}" stroke-width=".7" opacity=".6"/></g>`
      : `<rect x="${cx}" y="${cy}" width="17" height="17" fill="none" stroke="${K.ink}" stroke-width=".6" stroke-dasharray="2 3" opacity=".4"/>`;
  }
  // hull patches and damaged bits
  s += `<g filter="url(#rough2)" stroke="${K.ink}" stroke-width="1.1"><rect x="318" y="250" width="30" height="20" fill="${K.paper2}"/><path d="M322 254L344 266M344 254L322 266" stroke-width=".8"/>
    <rect x="598" y="30" width="28" height="20" fill="${K.paper2}"/><path d="M602 34L622 46M622 34L602 46" stroke-width=".8"/></g>`;
  // steam from the engine room (strained)
  s += [0, 1, 2].map((i) => `<circle class="steam" style="animation-delay:${i * 1.05}s" cx="${150 + i * 6}" cy="64" r="8" fill="#fff" opacity=".7" stroke="${K.ink}" stroke-width=".8"/>`).join("");
  s += `<g stroke="${K.ink}" fill="${K.paper2}" stroke-width="1"><circle cx="40" cy="190" r="3"/><circle cx="40" cy="120" r="3"/></g>`;
  // rivets
  s += Array.from({ length: 22 }, (_, i) => `<circle cx="${40 + i * 30}" cy="48" r="1.4" fill="${K.ink}"/><circle cx="${40 + i * 30}" cy="252" r="1.4" fill="${K.ink}"/>`).join("");
  // crew (+ notes)
  s += S.crew.map((c) => person(c, ...SPOT[c.id])).join("");
  if (sel) s += `<g transform="translate(${SPOT[sel][0]} ${SPOT[sel][1] - 34})" fill="none" stroke="${K.verm}" stroke-width="2" filter="url(#rough2)"><ellipse rx="30" ry="44"/></g>`;
  return s;
}
function shipScreen() {
  let s = page("The Marigold", "Plate IV · A longitudinal section, with the company at their stations") + margin();
  s += `<g transform="translate(70 168) scale(.93)">${shipDrawing()}</g>`;
  // notes pinned with red thread
  s += `<g>${slip(250, 470, -3, 168, 62, "Coolant loop two whines at night. <b>— T.K.</b>")}
    <path d="M334 474Q250 380 190 352" fill="none" stroke="${K.verm}" stroke-width="1.6" filter="url(#rough2)"/><circle cx="190" cy="352" r="3" fill="${K.verm}"/>
    ${slip(560, 486, 2, 178, 54, "Juno hasn't stood on dirt in forty days.")}<path d="M650 490Q760 400 780 372" fill="none" stroke="${K.verm}" stroke-width="1.6" filter="url(#rough2)"/><circle cx="780" cy="372" r="3" fill="${K.verm}"/></g>`;
  // chart vignette (range)
  const f = S.ship.supplies.fuel, cx = 150, cy = 612, k = 92;
  s += `<g><rect x="50" y="520" width="200" height="170" fill="${K.paper2}" opacity=".6" stroke="${K.ink}" stroke-width="1.2" filter="url(#rough)"/><text x="60" y="540" font-size="12" class="sc">Chart · how far we can sail</text>

function scale(x, y, ratio) { // brass balance: right pan heavier = dearer here

  const lx = -Math.cos(rad) * L, ly = -Math.sin(rad) * L, rx = Math.cos(rad) * L, ry = Math.sin(rad) * L;

  return `<g transform="translate(${x} ${y})" filter="url(#rough2)"><path d="M0 -4V42M-12 42H12" stroke="${K.ink}" stroke-width="2"/>
    <path d="M${lx} ${ly}L${rx} ${ry}" stroke="${K.brass}" stroke-width="3.5" stroke-linecap="round"/><path d="M${lx} ${ly}L${rx} ${ry}" stroke="${K.ink}" stroke-width=".8"/><circle r="3.5" fill="${K.brass}" stroke="${K.ink}"/>

}

  const T = rng(12);
  for (let i = 0; i < 9; i++) { const x = 130 + T() * 110 + i * 6, y = 160 + T() * 70; s += `<path d="M${x - 11} ${y + 6}L${x} ${y - 10}L${x + 11} ${y + 6}M${x - 3} ${y - 2}L${x + 3} ${y + 6}" fill="none" stroke="${K.ink}" stroke-width="1.2" filter="url(#rough2)"/>`; }
  for (let i = 0; i < 26; i++) { const x = 90 + T() * 300, y = 300 + T() * 280; if (Math.hypot(x - 250, y - 420) < 40) continue; s += `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)})" filter="url(#rough2)"><path d="M0 8V0M-5 0Q0-12 5 0Z" fill="${K.verd}" opacity=".6" stroke="${K.ink}" stroke-width="1"/></g>`; }
  s += `<path d="M300 150Q330 220 300 270T360 380T330 440" fill="none" stroke="${K.indigo}" stroke-width="3" opacity=".6" filter="url(#rough)"/>`;
  // storm side: hatching
  s += `<g><path d="M700 112H808V672H680Q730 540 690 440T700 112Z" fill="url(#hatchI)" opacity=".5"/><path d="M700 112Q730 300 690 440T680 672" fill="none" stroke="${K.ink}" stroke-width="2" stroke-dasharray="9 6"/></g>`;
  // safe radius (dividers)
  const tx = 420, ty = 395, rr = P.air * 230;
  s += `<circle cx="${tx}" cy="${ty}" r="${rr}" fill="${K.verd}" opacity=".07"/><circle cx="${tx}" cy="${ty}" r="${rr}" fill="none" stroke="${K.verd}" stroke-width="2" stroke-dasharray="10 6" filter="url(#rough)"/>
    <text x="${tx}" y="${ty + rr + 18}" text-anchor="middle" font-size="13" class="it" style="fill:${K.verd}">as far as the rope and the air allow</text><text class="num" x="${tx}" y="${ty + rr + 32}" text-anchor="middle">air ${pct(P.air)}</text>`;
  // lander + rope + footprints
  const lx = 150, ly = 530;
  s += `<path d="M${lx} ${ly}C${lx + 80} ${ly + 40} ${tx - 90} ${ty + 70} ${tx - 6} ${ty + 4}" fill="none" stroke="${K.brass}" stroke-width="3.2" filter="url(#rough2)"/><path d="M${lx} ${ly}C${lx + 80} ${ly + 40} ${tx - 90} ${ty + 70} ${tx - 6} ${ty + 4}" fill="none" stroke="${K.paper}" stroke-width="1.2" stroke-dasharray="3 5"/>
    <g transform="translate(${lx} ${ly})" filter="url(#rough2)" stroke="${K.ink}" stroke-width="1.4" fill="${K.paper2}"><path d="M-16 8L-10-10H10L16 8Z"/><path d="M-20 14L-16 8M20 14L16 8"/><circle cy="-2" r="4"/><ellipse cx="-24" cy="22" rx="12" ry="6" fill="none" stroke="${K.brass}" stroke-width="3"/><ellipse cx="-24" cy="22" rx="7" ry="3" fill="none" stroke="${K.brass}"/></g>
    <text x="${lx - 10}" y="${ly + 52}" font-size="12" class="it" text-anchor="middle">the lander, and the coil of rope</text>`;
  for (let i = 0; i < 9; i++) { const t = i / 9; s += `<ellipse cx="${(lx + 20 + t * (tx - lx - 40) + Math.sin(i) * 3).toFixed(0)}" cy="${(ly - 8 - t * (ly - ty - 20) + (i % 2 ? 5 : -5)).toFixed(0)}" rx="2.6" ry="1.4" fill="${K.ink}" opacity=".55"/>`; }
  // POIs
  S.planet.pois.forEach((p) => {
    const [x, y] = PX[p.id], on = p.id === poiSel, far = Math.hypot(x - tx, y - ty) > rr;
    s += `<g data-poi="${p.id}" data-tip="<b>${p.seen ? p.name : "Unknown"}</b><br>${p.seen ? p.note : "Something answers the scanner."}${far ? "<br>Beyond the rope." : ""}">
      ${on ? `<ellipse cx="${x}" cy="${y}" rx="34" ry="30" fill="none" stroke="${K.verm}" stroke-width="2.2" filter="url(#rough)"/>` : ""}${poiDraw(p, x, y)}
      <text x="${x}" y="${y + 38}" text-anchor="middle" font-size="12.5" class="it" opacity="${far ? 0.6 : 1}">${p.seen ? p.name : "something out there"}</text></g>`;
  });
  // team
  S.planet.team.forEach((id, i) => s += person(crewById[id], tx - 14 + i * 14, ty + 10 - (i % 2) * 5, 1.1).replace(/<g transform="translate\(([^)]*)\) scale\(([^)]*)\)" data-crew/, '<g transform="translate($1) scale($2)" data-crew'));
  s += `<g transform="translate(${tx} ${ty - 6})"><path d="M0 -42V-62M0-62L16-56L0-50" fill="${K.verm}" stroke="${K.ink}" stroke-width="1.2" filter="url(#rough2)"/></g>`;
  // wind head (storm)
  s += `<g transform="translate(752 270) scale(1.25)"><g filter="url(#rough2)" stroke="${K.ink}" stroke-width="1.6"><circle r="34" fill="${K.paper2}"/><circle cx="-14" cy="6" r="14" fill="${K.rose}" opacity=".6"/><circle cx="14" cy="6" r="14" fill="${K.rose}" opacity=".6"/>
    <path d="M-18-12Q-12-17-6-11M6-11Q12-17 18-12M-3 12H3M0-4L-2 4H2" fill="none"/><circle cx="-11" cy="-6" r="1.6" fill="#2a2017"/><circle cx="11" cy="-6" r="1.6" fill="#2a2017"/><ellipse cx="-30" cy="8" rx="9" ry="6" fill="${K.paper2}"/></g>
    ${[0, 1, 2].map((i) => `<path class="gust" d="M-42 ${4 + i * 8}Q-90 ${i * 8 - 4} -${130 + i * 20} ${i * 6 + 6}" fill="none" stroke="${K.indigo}" stroke-width="2" stroke-dasharray="14 10" stroke-linecap="round"/>`).join("")}</g>
    <text x="706" y="344" font-size="12.5" class="it" text-anchor="middle" transform="rotate(8 706 344)">the storm comes this way</text>
    </g>`;
  // compass rose
  s += `<g transform="translate(116 168)" filter="url(#rough2)" stroke="${K.ink}" stroke-width="1.2" fill="${K.paper2}"><circle r="26" fill="none"/><path d="M0-30L5 0L0 30L-5 0Z M-30 0L0-5L30 0L0 5Z"/><path d="M0-30L5 0H-5Z" fill="${K.verm}"/></g><text x="116" y="132" text-anchor="middle" font-size="12" class="sc">N</text>`;
  s += `<text class="num" x="70" y="132">mapped ${pct(P.surveyed)}</text>`;
  // right: card
  const p = P.pois.find((q) => q.id === poiSel);
  s += `<g><rect x="836" y="140" width="404" height="330" fill="${K.paper2}" stroke="${K.ink}" stroke-width="1.4" filter="url(#rough)"/><rect x="844" y="148" width="388" height="314" fill="none" stroke="${K.ink}" stroke-width=".7"/>
    <text x="1038" y="180" text-anchor="middle" font-size="20" class="sc" style="font-weight:bold">${p.name}</text><text x="1038" y="199" text-anchor="middle" font-size="13" class="it">${POIT[p.kind]}</text><path d="M960 208H1116" stroke="${K.ink}" stroke-width=".8"/>
    <foreignObject x="858" y="214" width="360" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="font:italic 14px/1.35 Georgia,serif;text-align:center;color:#2a2017">${p.note}</div></foreignObject>`;
  if (p.kind === "people") {
    const planks = 10, have = Math.round(p.rapport * planks), bx = 884, bw = 308, by = 330;
    s += `<text x="862" y="278" font-size="12" class="sc" opacity=".75">The bridge between us</text>
      <g filter="url(#rough)"><path d="M860 ${by - 10}H${bx + 12}V${by + 100}H860Z" fill="${K.ochre}" opacity=".55" stroke="${K.ink}" stroke-width="1.4"/><path d="M${bx + bw - 12} ${by - 10}H1218V${by + 100}H${bx + bw - 12}Z" fill="${K.rose}" opacity=".55" stroke="${K.ink}" stroke-width="1.4"/></g>
      <path d="M${bx + 12} ${by - 18}Q${bx + bw / 2} ${by + 20} ${bx + bw - 12} ${by - 18}" fill="none" stroke="${K.ink}" stroke-width="1.4" filter="url(#rough2)"/>`;
    for (let i = 0; i < planks; i++) { const x = bx + 22 + i * ((bw - 56) / (planks - 1)), t = (x - bx - 12) / (bw - 24), y = by - 6 + Math.sin(t * Math.PI) * 18;
      s += i < have ? `<g filter="url(#rough2)"><rect x="${x - 8}" y="${y}" width="16" height="6" fill="${K.brass}" stroke="${K.ink}" stroke-width="1"/><path d="M${x} ${y - 14 - Math.sin(t * Math.PI) * 4}V${y}" stroke="${K.ink}" stroke-width=".8"/></g>`
        : `<rect x="${x - 8}" y="${y}" width="16" height="6" fill="none" stroke="${K.ink}" stroke-width=".8" stroke-dasharray="2 3" opacity=".45"/>`; }
    s += `<g transform="translate(910 ${by + 62})"><path d="M0 0Q-4-14 0-22" stroke="${K.ink}" fill="none"/>${person(crewById.pip, 0, 12, 1).replace(/<g transform=[^>]*data-crew[^>]*>/, (m) => m)}</g>
      <g transform="translate(1160 ${by + 72})"><circle r="9" fill="${K.skin}" stroke="${K.ink}" stroke-width="1.4"/><path d="M-6-2H6M-5 3H5" stroke="${K.ink}"/>${weather("steady", 0, -22, 0.8)}</g>
      <text class="num" x="1038" y="${by - 24}" text-anchor="middle">${have} of ${planks} planks</text>
      <text x="862" y="460" font-size="12" class="sc" opacity=".75" dy="-6"></text>`;
    ["gift", "ask", "hands"].forEach((id, i) => {
      const lab = { gift: "A gift", ask: "A question", hands: "Open hands" }[id], x = 920 + i * 112;
      s += `<g transform="translate(${x} 440)" style="cursor:pointer" data-tip="<b>${lab}</b>"><circle r="21" fill="#a8321f" stroke="${K.ink}" stroke-width="1.4" filter="url(#rough2)"/><circle r="15" fill="none" stroke="#f7e0c0" stroke-opacity=".6" stroke-width="2"/>
        <text y="5" text-anchor="middle" font-size="17" class="it" style="fill:#f7e0c0">${{ gift: "G", ask: "?", hands: "H" }[id]}</text><text y="38" text-anchor="middle" font-size="11" class="it">${lab}</text></g>`;
    });
  } else {
    s += `<text x="1038" y="330" text-anchor="middle" font-size="14" class="it" opacity=".6">Not yet visited.</text>`;
  }
  s += `</g>`;
  // lantern + hourglass
  const air = P.air;
  s += `<g transform="translate(900 580)" data-tip="<b>The lantern</b><br>Our air and charge. It burns low."><g filter="url(#rough2)" stroke="${K.ink}" stroke-width="1.5"><path d="M-14-30H14L18 24H-18Z" fill="#f7efd9" opacity=".9"/><path d="M-8-38H8L14-30H-14Z M-3-46H3V-38H-3Z" fill="${K.brass}"/><path d="M-20 24H20V30H-20Z" fill="${K.brass}"/>
    <path class="flame" d="M0 ${24 - air * 40}Q9 ${24 - air * 18} 0 20Q-9 ${24 - air * 18} 0 ${24 - air * 40}Z" fill="#f2a93a" stroke="${K.ink}" stroke-width="1"/></g>
    <circle r="${20 + air * 30}" cy="0" fill="#f7d77a" opacity=".2" filter="url(#blot)"/><text y="56" text-anchor="middle" font-size="12" class="sc">Lantern</text></g>
    <g transform="translate(1100 580)" data-tip="<b>The hourglass</b><br>The storm arrives when the sand runs out."><g filter="url(#rough2)" stroke="${K.ink}" stroke-width="1.5">
    <path d="M-18-34H18M-18 34H18" stroke-width="3"/><path d="M-14-30Q-14-4 0 0Q14-4 14-30Z M-14 30Q-14 4 0 0Q14 4 14 30Z" fill="${K.paper2}"/>
    <path d="M-${(P.stormEta * 12 + 1).toFixed(0)} -${(P.stormEta * 26).toFixed(0)}H${(P.stormEta * 12 + 1).toFixed(0)}Q8-8 0-2Q-8-8 -${(P.stormEta * 12 + 1).toFixed(0)} -${(P.stormEta * 26).toFixed(0)}Z" fill="${K.ochre}" stroke="none"/>
    <path d="M-12 30Q-10 ${30 - (1 - P.stormEta) * 24} 0 ${30 - (1 - P.stormEta) * 28}Q10 ${30 - (1 - P.stormEta) * 24} 12 30Z" fill="${K.ochre}" stroke="none"/><path d="M0-2V28" stroke="${K.ochre}" stroke-width="1.2" stroke-dasharray="2 2"/></g>
    <text y="56" text-anchor="middle" font-size="12" class="sc">Storm</text><text class="num" y="70" text-anchor="middle">eta ${pct(P.stormEta)}</text></g>`;
  // action stamps
  s += `<g>${[["Scan", "scan"], ["Walk", "move"], ["Sample", "sample"], ["Speak", "talk"], ["Haul back", "recall"]].map(([n], i) => `<g transform="translate(${336 + i * 98} 676)" style="cursor:pointer"><rect x="-44" y="-18" width="88" height="30" fill="${K.paper2}" stroke="${K.ink}" stroke-width="1.3" filter="url(#rough2)"/><text y="3" text-anchor="middle" font-size="13" class="sc">${n}</text></g>`).join("")}</g>`;
  return s;
}

/* ======================================================================= MOUNT */
const stage = document.querySelector("#stage");
initTips(stage);
const shell = initShell({
  render(tab, root) {
    const body = { ship: shipScreen, market: marketScreen, explore: exploreScreen }[tab]();
    root.innerHTML = `<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">${defs()}${body}</svg>`;
  },
});
stage.addEventListener("click", (e) => {
  const c = e.target.closest("[data-crew]"), p = e.target.closest("[data-poi]");
  if (c && c.dataset.crew !== sel) { sel = c.dataset.crew; shell.redraw(); }
  if (p && p.dataset.poi !== poiSel) { poiSel = p.dataset.poi; shell.redraw(); }
});
</script>
</body>
</html>

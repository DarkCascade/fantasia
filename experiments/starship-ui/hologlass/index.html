<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starship UI · Hologlass</title>
<style>
  :root{--bg:#03060c;--cy:#5ee7ff;--ice:#bff6ff;--am:#ffb454;--mag:#ff4d8d;--gold:#ffd98a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ice);
    font-family:Inter,"Segoe UI",system-ui,sans-serif;font-weight:300}
  body{display:flex;flex-direction:column;align-items:center}
  .bar{width:100%;display:flex;gap:14px;align-items:center;padding:8px 16px;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:#7fb8c8;border-bottom:1px solid #12303c;background:#04090f}
  .bar a{color:#7fb8c8;text-decoration:none}.bar b{color:var(--cy);font-weight:500;letter-spacing:.3em}
  .bar nav{margin-left:auto;display:flex;gap:6px}
  .bar button{all:unset;cursor:pointer;padding:5px 12px;border:1px solid #17404f;border-radius:99px;color:#7fb8c8}
  .bar button.on{background:#0e3a48;color:var(--ice);border-color:var(--cy)}
  #stage{width:min(100vw,calc((100vh - 42px)*16/9));aspect-ratio:16/9;position:relative}
  svg{width:100%;height:100%;display:block;font-family:inherit}
  text{fill:var(--ice);font-weight:300}
  .cap{font-size:10px;letter-spacing:.28em;text-transform:uppercase;fill:#6aa6b8}
  .num{opacity:0;transition:opacity .25s;font-size:10px;fill:var(--gold);font-weight:500;pointer-events:none}
  body.lens .num{opacity:1}
  .flow{stroke-dasharray:3 9;animation:flow 1.1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-12}}
  .flick{animation:flick 1.3s steps(1) infinite}
  @keyframes flick{0%{opacity:1}8%{opacity:.35}12%{opacity:1}55%{opacity:.8}60%{opacity:.25}64%{opacity:1}}
  .rise{animation:rise 1.6s linear infinite}.fall{animation:fall 1.6s linear infinite}
  @keyframes rise{0%{transform:translateY(5px);opacity:0}50%{opacity:1}100%{transform:translateY(-6px);opacity:0}}
  @keyframes fall{0%{transform:translateY(-5px);opacity:0}50%{opacity:1}100%{transform:translateY(6px);opacity:0}}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sweep{animation:sweep 5s linear infinite;transform-origin:470px 360px}
  @keyframes sweep{to{transform:rotate(360deg)}}
  .march{animation:march 2.2s linear infinite}
  @keyframes march{from{transform:translateX(24px);opacity:0}30%{opacity:1}to{transform:translateX(-24px);opacity:0}}
  [data-crew],[data-poi],[data-good]{cursor:pointer}
  .btn:hover rect{fill:rgba(94,231,255,.18)}
  .tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .12s;z-index:9;max-width:240px;padding:8px 11px;
    background:rgba(4,14,22,.92);border:1px solid #1f5a6c;border-radius:8px;font-size:12px;line-height:1.35;color:var(--ice)}
  .tip b{font-weight:500;color:var(--cy)}
</style>
</head>
<body>
<div class="bar">
  <a href="../index.html">◂ Gallery</a><b>Hologlass</b>
  <nav><button data-tab="ship">1 · Ship</button><button data-tab="market">2 · Trade hub</button>
  <button data-tab="explore">3 · Exploration</button><button data-lens>N · Numbers lens</button></nav>
</div>
<div id="stage"></div>

<script src="../shared/state.js"></script>
<script>
const S = STATE;
const C = { cy: "#5ee7ff", ice: "#bff6ff", am: "#ffb454", mag: "#ff4d8d", gold: "#ffd98a", vio: "#9d8cff", mint: "#6df0c2", dim: "#2c4f60" };
const MOODC = { radiant: C.gold, content: C.mint, steady: C.cy, restless: C.am, strained: "#ff7a45", fraying: C.mag };
const PULSE = { radiant: 4, content: 3.2, steady: 2.6, restless: 1.8, strained: 1.1, fraying: 0.7 };
const GOODC = { ice: "#8fe8ff", grain: "#ffd98a", salt: "#e6dcff", cells: "#6df0c2", alloy: "#9d8cff", glass: "#7fd0ff", med: "#ff7fb0", data: "#ffb454" };

/* 24-unit line icons, centred on 0,0 */
const ICON = {
  fuel: "M0-10 Q8 0 8 4 A8 8 0 0 1 -8 4 Q-8 0 0-10Z",
  rations: "M-9 0H9Q9 9 0 9Q-9 9 -9 0Z M-3-3Q-1-7 1-3 M3-3Q5-7 7-3",
  parts: "M0-4A4 4 0 1 0 0 4A4 4 0 1 0 0-4 M0-10V-7M0 7V10M-10 0H-7M7 0H10M-7-7L-5-5M5 5L7 7M7-7L5-5M-5 5L-7 7",
  credit: "M-9 0A9 9 0 1 0 9 0A9 9 0 1 0 -9 0 M-5 0A5 5 0 1 0 5 0A5 5 0 1 0 -5 0",
  ice: "M0-10L7-3L4 9H-4L-7-3Z M0-10V9 M-7-3H7",
  grain: "M0 10V-8 M0-2Q-6-4-6-9 M0-2Q6-4 6-9 M0 3Q-6 1-6-4 M0 3Q6 1 6-4",
  salt: "M-8 9L-6-1L-2 9Z M-2 9L1-8L6 9Z M4 9L6 2L9 9",
  cells: "M-6-8H6V10H-6Z M-2-11H2V-8 M-1-2H2L-1 3H2",
  alloy: "M-9 6L-5-5H5L9 6Z M-5-5L-3 6 M5-5L3 6",
  glass: "M-6-9H6L4 1Q0 5-4 1Z M0 4V9 M-5 9H5",
  med: "M-3-8H3V-3H8V3H3V8H-3V3H-8V-3H-3Z",
  data: "M-9 0A9 9 0 1 0 9 0A9 9 0 1 0 -9 0 M-2.5 0A2.5 2.5 0 1 0 2.5 0A2.5 2.5 0 1 0 -2.5 0 M-9 0H-5",
  wreck: "M-8 4L-2-6L2 0L8-6L6 6Z", vein: "M0-9L5-2L0 5L-5-2Z M6 2L9 6L5 9L3 5Z",
  ruin: "M-8 9V-1L-4-8L0-1V9 M0 9V1L4-5L8 1V9", people: "M-9 9L0-8L9 9Z M0-8V9 M-3 9L0 3L3 9",
  hazard: "M0-9L9 8H-9Z M0-3V3 M0 5.5V6", unknown: "M-4-5Q-4-9 0-9Q5-9 5-4Q5-1 0 1V3 M0 6V7",
  scan: "M-9 2A9 9 0 0 1 9 2 M-5 2A5 5 0 0 1 5 2 M-9 8H9", move: "M-8 0H8 M3-5L8 0L3 5",
  sample: "M-3-9H3 M-2-9V-2L-8 8H8L2-2V-9", talk: "M-9-6H9V3H0L-5 8V3H-9Z", recall: "M-8 4Q-8-6 0-6Q8-6 8 4 M5 1L8 4L11 1",
  gift: "M-7-2H7V8H-7Z M-8-6H8V-2H-8Z M0-6V8 M0-6Q-5-12-6-8 M0-6Q5-12 6-8", ask: "M-4-5Q-4-9 0-9Q5-9 5-4Q5-1 0 1V3 M0 6V7",
  hands: "M-9 3Q-9-3-4-3L2-3L2 3 M9 3Q9-3 4-3 M-9 3H9",
  zz: "M-5-6H0L-5 0H0 M1 1H5L1 6H5", planet: "M-7 0A7 7 0 1 0 7 0A7 7 0 1 0 -7 0 M-12 3Q0-6 12-3",
  wrench: "M-8 8L2-2 M2-2A5 5 0 1 1 8-8L5-5 5-3 3-3Z", heart: "M0 8L-8-1Q-9-8-3-8Q0-8 0-4Q0-8 3-8Q9-8 8-1Z",
  bolt: "M2-10L-5 1H0L-2 10L6-2H1Z",
};
const ico = (n, x, y, s = 1, col = C.ice, sw = 1.5) =>
  `<g transform="translate(${x} ${y}) scale(${s})" fill="none" stroke="${col}" stroke-width="${sw / s}" stroke-linecap="round" stroke-linejoin="round"><path d="${ICON[n]}"/></g>`;
const lvlCol = (v) => (v >= 0.5 ? C.cy : v >= 0.25 ? C.am : C.mag);
const pct = (v) => Math.round(v * 100) + "%";

function defs() {
  return `<defs>
  <radialGradient id="bgG" cx="50%" cy="42%" r="80%"><stop offset="0" stop-color="#0c1d2f"/><stop offset="1" stop-color="#03060c"/></radialGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowL" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fefff" stop-opacity=".14"/><stop offset="1" stop-color="#9fefff" stop-opacity=".025"/></linearGradient>
  <linearGradient id="dearG" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffb454" stop-opacity=".14"/><stop offset="1" stop-color="#ffb454" stop-opacity="0"/></linearGradient>
  <linearGradient id="cheapG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ee7ff" stop-opacity=".14"/><stop offset="1" stop-color="#5ee7ff" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#5ee7ff" stroke-opacity=".045"/></pattern>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V6" stroke="#5ee7ff" stroke-opacity=".22"/></pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".03"/></pattern>
  </defs>`;
}
function bg() {
  const r = rng(7); let stars = "";
  for (let i = 0; i < 90; i++) stars += `<circle cx="${(r() * 1280).toFixed(0)}" cy="${(r() * 720).toFixed(0)}" r="${(r() * 1.1 + 0.2).toFixed(1)}" fill="#bff6ff" opacity="${(r() * 0.5 + 0.1).toFixed(2)}"/>`;
  return `<rect width="1280" height="720" fill="url(#bgG)"/><rect width="1280" height="720" fill="url(#grid)"/>${stars}`;
}
function overlay() { return `<rect width="1280" height="720" fill="url(#scan)" pointer-events="none"/>`; }

function ring(x, y, r, v, col, w = 2.5) {
  const L = 2 * Math.PI * r;
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#17384a" stroke-width="${w}"/>
  <circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${(L * v).toFixed(1)} ${L.toFixed(1)}" transform="rotate(-90 ${x} ${y})" filter="url(#glow)"/>`;
}
function panel(x, y, w, h, r = 14) {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="url(#glass)" stroke="#2d8aa0" stroke-opacity=".55"/>
  <path d="M${x} ${y + 14}V${y}H${x + 14} M${x + w - 14} ${y}H${x + w}V${y + 14} M${x + w} ${y + h - 14}V${y + h}H${x + w - 14} M${x + 14} ${y + h}H${x}V${y + h - 14}" fill="none" stroke="${C.cy}" stroke-width="1.5" filter="url(#glow)"/>`;
}
function hud(sub) {
  const sp = S.ship.supplies;
  const items = [["fuel", sp.fuel, "Fuel"], ["rations", sp.rations, "Rations"], ["parts", sp.parts, "Spare parts"]];
  let h = `<text x="40" y="44" font-size="17" letter-spacing="9" style="font-weight:400">${S.ship.name.toUpperCase()}</text>
    <text class="cap" x="40" y="62">${sub}</text>`;
  items.forEach(([k, v, n], i) => {
    const x = 1010 + i * 60;
    h += `<g data-tip="<b>${n}</b><br>${v < 0.5 ? "Getting low." : "Comfortable."}">${ring(x, 44, 17, v, lvlCol(v))}${ico(k, x, 44, 0.8, lvlCol(v), 1.4)}
      <text class="num" x="${x}" y="76" text-anchor="middle">${pct(v)}</text></g>`;
  });
  h += topRail();
  h += `<g>${ico("credit", 1186, 44, 0.9, C.gold)}<text x="1240" y="49" text-anchor="end" font-size="15" style="font-weight:400" fill="${C.gold}">12.4k</text></g>`;
  return h;
}
function attention(line, x = 40, y = 100) {
  return `<g><circle cx="${x + 5}" cy="${y - 4}" r="4" fill="${C.am}" filter="url(#glow)"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="${x + 20}" y="${y}" font-size="14" fill="${C.ice}">${line}</text></g>`;
}
const crewById = S.crewById;

/* ===================================================== control-panel widgets
 * LCARS-flavoured bridge-console parts. None of them carry meaning that the main
 * screen doesn't already show: they're texture and a second, optional read-out
 * (the EKG speeds up with stress, the harmonics go ragged with a strained
 * engine, the power sliders are the ship's systems). */
const LC = { am: "#ffb454", pe: "#ffd3a1", vi: "#9d8cff", li: "#c9bfff", ro: "#ff7fb0", cy: "#5ee7ff", ink: "#050a10" };
let _u = 0; const uid = (p) => p + ++_u;
const hex = (r, n = 4) => Math.floor(r() * 16 ** n).toString(16).toUpperCase().padStart(n, "0");

function lcTab(x, y, w, label, col = LC.am) { // pill with a round left end, dark label
  return `<g><path d="M${x + 9} ${y}H${x + w}V${y + 17}H${x + 9}A8.5 8.5 0 0 1 ${x + 9} ${y}Z" fill="${col}"/><text x="${x + w - 8}" y="${y + 12.5}" text-anchor="end" font-size="9" letter-spacing="2.2" style="fill:${LC.ink};font-weight:600">${label}</text></g>`;
}
function lcElbow(x, y, w, vh, th, col) { // top-left elbow: bar along the top, bar down the left
  const vw = th * 1.7, r = th * 1.5, ri = th * 0.6;
  return `<path d="M${x} ${y + vh}V${y + r}A${r} ${r} 0 0 1 ${x + r} ${y}H${x + w}V${y + th}H${x + vw + ri}A${ri} ${ri} 0 0 0 ${x + vw} ${y + th + ri}V${y + vh}Z" fill="${col}"/>`;
}
function lcButton(x, y, w, label, col, code) { // stacked console button, flat left, round right
  return `<g class="btn" style="cursor:pointer"><path d="M${x} ${y}H${x + w - 9}A9 9 0 0 1 ${x + w - 9} ${y + 18}H${x}Z" fill="${col}"/><text x="${x + 8}" y="${y + 13}" font-size="9.5" letter-spacing="2" style="fill:${LC.ink};font-weight:600">${label}</text>
    <text x="${x + w - 20}" y="${y + 13}" text-anchor="end" font-size="8" style="fill:${LC.ink};opacity:.6">${code}</text></g>`;
}
function topRail(seed = 3) { // a row of segmented pills with tiny codes, and a stardate readout
  const r = rng(seed), cols = [LC.am, LC.vi, LC.ro, LC.pe, LC.li]; let x = 300, s = "", i = 0;
  while (x < 740) { let w = 24 + Math.floor(r() * 70); if (x + w > 792) w = 792 - x; const c = cols[i++ % cols.length];
    s += `<rect x="${x}" y="14" width="${w}" height="10" rx="5" fill="${c}" opacity="${(0.55 + r() * 0.4).toFixed(2)}"/>${w > 54 ? `<text x="${x + w / 2}" y="22.2" text-anchor="middle" font-size="6.5" style="fill:${LC.ink};font-weight:600">${hex(r, 2)}-${Math.floor(r() * 90 + 10)}</text>` : ""}`; x += w + 5; }
  return s + `<text x="808" y="23" font-size="9" letter-spacing="2" style="fill:${LC.am}">STARDATE 47214.6</text>`;
}
function knob(cx, cy, r, v, label, col = LC.am) { // rotary dial: 270° sweep, filled arc = value
  const a0 = -135, a1 = a0 + v * 270, P = (a, rr) => [cx + Math.cos((a - 90) * Math.PI / 180) * rr, cy + Math.sin((a - 90) * Math.PI / 180) * rr];
  const [sx, sy] = P(a0, r), [ex, ey] = P(a1, r), [ox, oy] = P(135, r);
  let s = `<circle cx="${cx}" cy="${cy}" r="${r + 5}" fill="#050c14" stroke="#17384a"/><path d="M${sx} ${sy}A${r} ${r} 0 1 1 ${ox.toFixed(1)} ${oy.toFixed(1)}" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round"/>
    <path d="M${sx} ${sy}A${r} ${r} 0 ${v * 270 > 180 ? 1 : 0} 1 ${ex.toFixed(1)} ${ey.toFixed(1)}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>`;
  for (let i = 0; i <= 10; i++) { const a = a0 + i * 27, [x1, y1] = P(a, r + 7), [x2, y2] = P(a, r + 10); s += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${C.cy}" stroke-opacity=".45"/>`; }
  const [px, py] = P(a1, r - 4);
  return s + `<circle cx="${cx}" cy="${cy}" r="${r - 6}" fill="url(#glass)" stroke="${C.cy}" stroke-opacity=".5"/><line x1="${cx}" y1="${cy}" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" stroke="${C.ice}" stroke-width="2" stroke-linecap="round"/>
    <text class="cap" x="${cx}" y="${cy + r + 22}" text-anchor="middle" style="font-size:7.5px;letter-spacing:.18em">${label}</text>`;
}
function vSlider(x, y, h, v, label, col = LC.am, n = 12) { // LED ladder + a slider cap
  let s = ""; const sh = (h - 4) / n;
  for (let i = 0; i < n; i++) { const on = (n - i) / n <= v + 0.001, yy = y + i * sh; s += `<rect x="${x - 9}" y="${yy.toFixed(1)}" width="18" height="${(sh - 2).toFixed(1)}" rx="1.5" fill="${on ? col : "#12293a"}" opacity="${on ? 0.85 : 1}"/>`; }
  const ky = y + (1 - v) * (h - 8);
  return s + `<rect x="${x - 13}" y="${ky.toFixed(1)}" width="26" height="8" rx="3" fill="${LC.ink}" stroke="${C.ice}" stroke-width="1.4" filter="url(#glow)"/><line x1="${x - 5}" y1="${(ky + 4).toFixed(1)}" x2="${x + 5}" y2="${(ky + 4).toFixed(1)}" stroke="${col}" stroke-width="1.6"/>
    <text class="cap" x="${x}" y="${y + h + 13}" text-anchor="middle" style="font-size:7.5px;letter-spacing:.14em">${label}</text>`;
}
function scope(x, y, w, h, { kind = "sine", dur = 3, amp = 0.7, col = C.cy, beats = 2, seed = 1 } = {}) { // scrolling trace
  const id = uid("sc"), r = rng(seed), N = 160, mid = y + h / 2; let d = "";
  for (let i = 0; i <= N; i++) {
    const t = (i / N) * 2, ph = (t * beats) % 1, X = x + (t * w) / 1; let v = 0;
    if (kind === "sine") v = Math.sin(t * Math.PI * 2 * beats);
    if (kind === "noisy") v = Math.sin(t * Math.PI * 2 * beats) * 0.7 + (r() - 0.5) * 0.9;
    if (kind === "square") v = Math.sin(t * Math.PI * 2 * beats) > 0 ? 0.8 : -0.8;
    if (kind === "ekg") v = ph < 0.1 ? 0 : ph < 0.18 ? 0.25 * Math.sin(((ph - 0.1) / 0.08) * Math.PI) : ph < 0.3 ? 0 : ph < 0.34 ? -0.3 * ((ph - 0.3) / 0.04) : ph < 0.4 ? -0.3 + 1.6 * ((ph - 0.34) / 0.06) : ph < 0.46 ? 1.3 - 1.9 * ((ph - 0.4) / 0.06) : ph < 0.5 ? -0.6 + 0.6 * ((ph - 0.46) / 0.04) : ph < 0.66 ? 0.28 * Math.sin(((ph - 0.5) / 0.16) * Math.PI) : 0;
    d += (i ? "L" : "M") + X.toFixed(1) + " " + (mid - v * amp * (h / 2)).toFixed(1);
  }
  const grid = Array.from({ length: 5 }, (_, i) => `<line x1="${x + (i + 1) * w / 6}" y1="${y}" x2="${x + (i + 1) * w / 6}" y2="${y + h}"/>`).join("") + Array.from({ length: 3 }, (_, i) => `<line x1="${x}" y1="${y + (i + 1) * h / 4}" x2="${x + w}" y2="${y + (i + 1) * h / 4}"/>`).join("");
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="#04101a" stroke="#1f5a6c"/><g stroke="${C.cy}" stroke-opacity=".12">${grid}</g>
    <clipPath id="${id}"><rect x="${x + 1}" y="${y + 1}" width="${w - 2}" height="${h - 2}"/></clipPath><g clip-path="url(#${id})"><g><animateTransform attributeName="transform" type="translate" from="0 0" to="${-w} 0" dur="${dur}s" repeatCount="indefinite"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" filter="url(#glow)"/></g></g>`;
}
function spectrum(x, y, w, h, n, { seed = 5, rough = 0.3, col = C.cy, hot = LC.ro } = {}) {
  const r = rng(seed), bw = w / n; let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="#04101a" stroke="#1f5a6c"/>`;
  for (let i = 0; i < n; i++) {
    const base = 0.25 + 0.55 * Math.exp(-Math.pow((i - n * 0.35) / (n * 0.28), 2)), hs = Array.from({ length: 5 }, () => Math.max(0.06, Math.min(1, base + (r() - 0.5) * (0.35 + rough))));
    const hh = (v) => (v * (h - 6)).toFixed(1), yy = (v) => (y + h - 3 - v * (h - 6)).toFixed(1), c = hs.some((v) => v > 0.88) ? hot : col, d = (0.7 + r() * 0.9).toFixed(2);
    s += `<rect x="${(x + i * bw + 1.5).toFixed(1)}" y="${yy(hs[0])}" width="${(bw - 3).toFixed(1)}" height="${hh(hs[0])}" fill="${c}" opacity=".8"><animate attributeName="height" values="${[...hs, hs[0]].map(hh).join(";")}" dur="${d}s" repeatCount="indefinite"/><animate attributeName="y" values="${[...hs, hs[0]].map(yy).join(";")}" dur="${d}s" repeatCount="indefinite"/></rect>`;
  }
  return s;
}
function toggles(x, y, states, labels = []) {
  return states.map((on, i) => `<g transform="translate(${x + i * 34} ${y})"><rect width="26" height="12" rx="6" fill="${on ? "rgba(255,180,84,.25)" : "#0a1a26"}" stroke="${on ? LC.am : "#2c4f60"}"/><circle cx="${on ? 19 : 7}" cy="6" r="4.2" fill="${on ? LC.am : "#4b6a7a"}" ${on ? 'filter="url(#glow)"' : ""}/>

function blob(cx, cy, r, seed, n = 18, j = 0.18) {
  const g = rng(seed); const pts = [];
  for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2, rr = r * (1 - j / 2 + g() * j); pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.96]); }
  return "M" + pts.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L") + "Z";
}

  const p = S.planet.pois.find((q) => q.id === poiSel), col = POIC[p.kind];
  s += panel(790, 126, 450, 440) + `${ico(p.kind, 826, 168, 1.1, col)}<text x="860" y="170" font-size="20">${p.name}</text><text class="cap" x="860" y="190" style="fill:${col}">${{ people: "Settlement · people", ruin: "Ruin", vein: "Resource", wreck: "Salvage", hazard: "Hazard", unknown: "Unknown" }[p.kind]}</text>
    <foreignObject x="812" y="212" width="400" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="font:italic 300 14px/1.4 Inter,system-ui;color:#bff6ff">${p.note}</div></foreignObject>`;
  if (p.kind === "people") {
    const r = p.rapport, d = 70, sep = d * 2 * (1 - r * 0.85); // overlap grows with rapport
    s += `<text class="cap" x="812" y="290">Rapport</text>
      <g transform="translate(1015 380)"><circle cx="${-sep / 2}" r="${d}" fill="${C.cy}" fill-opacity=".14" stroke="${C.cy}" stroke-width="1.6" filter="url(#glow)"/>
      <circle cx="${sep / 2}" r="${d}" fill="${C.am}" fill-opacity=".14" stroke="${C.am}" stroke-width="1.6" filter="url(#glow)"/>
      <text class="cap" x="${-sep / 2 - d + 10}" y="${d + 24}" style="fill:${C.cy}">Us</text><text class="cap" x="${sep / 2 + d - 10}" y="${d + 24}" text-anchor="end" style="fill:${C.am}">The Hesk</text>
      <text class="num" y="4" text-anchor="middle">${r.toFixed(2)}</text></g>
      <text class="cap" x="812" y="500">Offer</text>`;
    [["gift", "A gift"], ["ask", "A question"], ["hands", "Open hands"]].forEach(([ic, n], i) => {
      s += `<g class="btn" transform="translate(${812 + i * 140} 512)" data-tip="<b>${n}</b>"><rect width="124" height="38" rx="19" fill="rgba(94,231,255,.07)" stroke="${C.cy}" stroke-opacity=".7"/>${ico(ic, 24, 19, 0.6, C.cy)}<text x="44" y="24" font-size="12">${n}</text></g>`;
    });
  } else {
    s += `<text class="cap" x="812" y="300">Not yet visited</text>`;
  }
  // action bar
  [["scan", "Scan"], ["move", "Move"], ["sample", "Sample"], ["talk", "Talk"], ["recall", "Recall"]].forEach(([ic, n], i) => {
    s += `<g class="btn" transform="translate(${230 + i * 118} 636)"><rect width="106" height="42" rx="21" fill="rgba(94,231,255,.07)" stroke="${C.cy}" stroke-opacity=".7"/>${ico(ic, 26, 21, 0.62, C.cy)}<text x="46" y="26" font-size="12" letter-spacing="1">${n}</text></g>`;
  });
  s += exploreWidgets();
  return s + overlay();
}

/* ======================================================================= MOUNT */
const stage = document.querySelector("#stage");
initTips(stage);
const shell = initShell({
  render(tab, root) {
    const body = { ship: shipScreen, market: marketScreen, explore: exploreScreen }[tab]();
    root.innerHTML = `<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">${defs()}${body}</svg>`;
  },
});
stage.addEventListener("click", (e) => {
  const c = e.target.closest("[data-crew]"), p = e.target.closest("[data-poi]");
  if (c && c.dataset.crew !== sel) { sel = c.dataset.crew; shell.redraw(); }
  if (p && p.dataset.poi !== poiSel) { poiSel = p.dataset.poi; shell.redraw(); }
});
</script>
